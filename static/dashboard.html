<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Dashboard</title>
<link rel="icon" href="/static/dashboard.png">
<style>
:root {
  --bg: #0e0f11; --panel: #17191c; --panel2: #1e2125; --line: #2a2e33; --text: #eceae4; --muted: #8d8a82;
  --amber: #f5a524; --amber-bg: #2e2410; --green: #3fb27f; --green-bg: #12261d; --blue: #6b8cff; --red: #ef5b5b;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: clamp(13px, 1.9vh, 19px)/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: clamp(10px, 1.8vh, 16px);
  padding: clamp(12px, 2.2vh, 20px) clamp(14px, 2vw, 24px); overflow: hidden; }
* { scrollbar-width: thin; scrollbar-color: #3a3f45 transparent; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
a { color: inherit; }

/* top bar */
.top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .02em; }
.tabs { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.tab { border-radius: 999px; padding: 5px 14px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.clock { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; }
.sdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.s-waiting { background: var(--amber); } .s-working { background: var(--green); } .s-idle { background: #555; }
.s-error { background: var(--red); } .s-queued { background: var(--blue); } .s-thinking { background: var(--green); }

/* banner */
.banner { border-radius: 16px; padding: clamp(12px, 2.4vh, 22px) clamp(16px, 2vw, 28px); display: flex; align-items: center; gap: 22px;
  background: var(--panel); border: 1px solid var(--line); min-width: 0; }
.banner > div:nth-child(2) { min-width: 0; }
.banner .big { font-size: clamp(20px, 3.6vh, 42px); font-weight: 700; line-height: 1.15; }
.banner .sub { color: var(--muted); font-size: clamp(13px, 1.9vh, 20px); margin-top: 4px; }
.banner .icon { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.banner.waiting { background: var(--amber-bg); border-color: var(--amber); }
.banner.waiting .icon { background: var(--amber); animation: pulse 1.4s infinite; }
.banner.working { background: var(--green-bg); border-color: #24563f; }
.banner.working .icon { background: var(--green); animation: pulse 2s infinite; }
.banner.idle .icon { background: #555; }
.banner .right { margin-left: auto; text-align: right; color: var(--muted); font-size: 15px; }
.banner .right b { color: var(--text); font-size: clamp(18px, 2.8vh, 26px); display: block; font-variant-numeric: tabular-nums; }
.banner .right { flex: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,.35); } 50% { box-shadow: 0 0 0 12px rgba(255,255,255,0); } }

/* main grid */
.main { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: clamp(10px, 1.8vh, 16px); min-height: 0; }
.col { display: flex; flex-direction: column; gap: clamp(10px, 1.8vh, 16px); min-height: 0; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: clamp(10px, 1.8vh, 16px) clamp(12px, 1.4vw, 18px);
  display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.panel h3 { margin: 0 0 clamp(8px, 1.4vh, 12px); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; flex: none; }
.panel .scroll { overflow: auto; min-height: 0; flex: 1; }
.panel .hd { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: clamp(8px, 1.4vh, 12px); flex: none; }
.panel .hd h3 { margin: 0; }

/* team: manager strip on top, worker cards below; nothing is ever squashed */
.team { display: flex; flex-direction: column; gap: clamp(8px, 1.4vh, 12px); flex: 1; min-height: 0; overflow: auto; padding-right: 2px; }
.agents { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); grid-auto-rows: max-content;
  align-content: start; gap: clamp(8px, 1.4vh, 12px); }
.card { background: var(--panel2); border: 1px solid var(--line); border-radius: 14px; padding: clamp(10px, 1.6vh, 14px) 14px;
  border-top: 4px solid var(--c); display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: none; }
.card.mgr { display: grid; grid-template-columns: minmax(150px, auto) minmax(0, 1fr); column-gap: 18px; row-gap: 4px; align-items: center; }
.card.mgr .last { grid-column: 2; grid-row: 1 / span 2; -webkit-line-clamp: 3; }
.card.mgr .meta { margin-top: 0; }
.card.st-thinking { border-color: var(--green); border-top-color: var(--c); }
.card.st-waiting { border-color: var(--amber); border-top-color: var(--c); }
.card .name { font-size: clamp(15px, 2.2vh, 25px); font-weight: 700; display: flex; align-items: center; gap: 10px; min-width: 0; }
.badge { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 6px;
  background: var(--line); color: var(--muted); font-weight: 600; }
.badge.m { background: var(--c); color: #fff; }
.state { font-size: clamp(13px, 1.8vh, 18px); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.state.thinking { color: var(--green); } .state.waiting { color: var(--amber); }
.state.error { color: var(--red); } .state.queued { color: var(--blue); } .state.idle { color: var(--muted); }
.dots span { animation: blink 1.2s infinite; } .dots span:nth-child(2) { animation-delay: .2s; } .dots span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
.last { color: #c9c6be; font-size: clamp(12.5px, 1.7vh, 17px); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: auto; }

.pipeline { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; margin-left: auto; }
.pipeline .lab { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 600; margin-right: 2px; }
.step { padding: 2px 10px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); }
.step.now { border-color: var(--green); color: var(--green); font-weight: 600; }
.arrow { color: var(--muted); }

.feed .item { display: grid; grid-template-columns: 54px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.feed .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.feed .who { font-weight: 600; }
.feed .txt { color: #bdbab2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

.files a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 8px;
  text-decoration: none; font-size: 14px; }
.files a:hover { background: var(--panel2); }
.files .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.files .fm { color: var(--muted); flex: none; }
.files .new { color: var(--green); font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; }

.foot { display: flex; gap: 8px 20px; color: var(--muted); font-size: 13px; align-items: center; flex-wrap: wrap; }
.foot b { color: var(--text); }
.foot .sp { flex: 1; }

/* narrow windows: stack the columns and let the page scroll */
@media (max-width: 900px) {
  body { overflow: auto; height: auto; grid-template-rows: auto; }
  html, body { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .team, .panel .scroll { overflow: visible; }
  .card.mgr { grid-template-columns: minmax(0, 1fr); }
  .card.mgr .last { grid-column: auto; grid-row: auto; }
  .banner .right { display: none; }
}
/* short windows: hide the per-card meta line to save height */
@media (max-height: 640px) { .card .meta { display: none; } }
</style>
</head>
<body>
  <div class="top">
    <div class="brand">TEAM DASHBOARD</div>
    <div class="tabs" id="tabs"></div>
    <button id="soundBtn" onclick="toggleSound()">🔕 Sound off</button>
    <button onclick="fullscreen()">⛶ Full screen</button>
    <div class="clock" id="clock"></div>
  </div>

  <div class="banner idle" id="banner">
    <div class="icon"></div>
    <div><div class="big" id="bigText">Loading…</div><div class="sub" id="subText"></div></div>
    <div class="right" id="bannerRight"></div>
  </div>

  <div class="main">
    <div class="col">
      <div class="panel" style="flex:1">
        <div class="hd"><h3>Team</h3><div class="pipeline" id="pipeline"></div></div>
        <div class="team"><div id="mgrCard"></div><div class="agents" id="agents"></div></div>
      </div>
    </div>
    <div class="col">
      <div class="panel" style="flex:1.3">
        <h3>Activity</h3>
        <div class="scroll feed" id="feed"></div>
      </div>
      <div class="panel" style="flex:1">
        <h3>Deliverables (shared folder)</h3>
        <div class="scroll files" id="files"></div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span id="footRooms"></span>
    <span class="sp"></span>
    <span>Relay to ChatGPT and chat at <a href="/" target="agenthub"><b>127.0.0.1:8765</b></a></span>
    <span id="conn"></span>
  </div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D = null, pinned = null, sound = false, lastState = {}, audio = null;
try { pinned = localStorage.getItem("dash-room"); sound = localStorage.getItem("dash-sound") === "1"; } catch {}

const ago = ts => { if (!ts) return "—"; const s = Math.max(0, D.now - ts);
  return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s/60)}m ago` : s < 86400 ? `${Math.floor(s/3600)}h ago` : `${Math.floor(s/86400)}d ago`; };
const hm = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const size = b => b < 1024 ? `${b} B` : b < 1048576 ? `${(b/1024).toFixed(1)} KB` : `${(b/1048576).toFixed(1)} MB`;

async function tick() {
  try {
    D = await fetch("/api/overview", {cache: "no-store"}).then(r => r.json());
    $("conn").textContent = "● live"; $("conn").style.color = "var(--green)";
    render();
  } catch {
    $("conn").textContent = "● hub offline: run start.bat"; $("conn").style.color = "var(--red)";
  }
}

function render() {
  const rooms = D.rooms;
  let room = rooms.find(r => r.id === pinned) || rooms[0];
  $("tabs").innerHTML = rooms.map(r => `<button class="tab ${room && r.id === room.id ? "on" : ""}" onclick="pin('${r.id}')">
      <span class="sdot s-${r.state}"></span>${esc(r.title)}</button>`).join("");
  const counts = {waiting: 0, working: 0, idle: 0}; rooms.forEach(r => counts[r.state]++);
  $("footRooms").innerHTML = `<b>${rooms.length}</b> rooms · <b>${counts.working}</b> working · <b>${counts.waiting}</b> waiting on you`;

  // Chime when any room newly needs you.
  rooms.forEach(r => { if (r.state === "waiting" && lastState[r.id] && lastState[r.id] !== "waiting") chime(); lastState[r.id] = r.state; });
  document.title = counts.waiting ? `(${counts.waiting}) Your turn · Team Dashboard` : "Team Dashboard";

  if (!room) { $("bigText").textContent = "No rooms yet"; $("subText").textContent = "Create one in the hub."; return; }

  const b = $("banner"); b.className = "banner " + room.state;
  if (room.state === "waiting") {
    $("bigText").textContent = `Your turn: relay to ${room.waiting_on}`;
    $("subText").textContent = `“${room.title}”: copy the prompt in the hub, paste it into ${room.waiting_on}, paste the reply back.`;
  } else if (room.state === "working") {
    $("bigText").textContent = room.working_on ? `${room.working_on} is working…` : "Team is working…";
    $("subText").textContent = `“${room.title}”. Nothing needed from you right now.`;
  } else {
    $("bigText").textContent = "All quiet";
    $("subText").textContent = `“${room.title}”. The team is waiting for your next instruction.`;
  }
  const used = room.manager ? Math.max(0, room.max_handoffs - room.handoffs_left) : null;
  $("bannerRight").innerHTML = room.manager && room.state !== "idle"
    ? `<b>${used} / ${room.max_handoffs}</b>hand-offs this round` : `<b>${room.message_count}</b>messages`;

  const cardHtml = a => {
    const label = {thinking: `Working<span class="dots"><span>.</span><span>.</span><span>.</span></span>`,
      waiting: "Waiting for your relay", queued: "Queued", error: "Error on last task", idle: "Idle"}[a.state];
    const kind = a.is_manager ? `<span class="badge m">Manager</span>` :
      `<span class="badge">${a.type === "claude_cli" ? "Claude" : a.type === "manual" ? "Relay" : a.type}</span>`;
    return `<div class="card ${a.is_manager ? "mgr" : ""} st-${a.state}" style="--c:${a.color || "#888"}">
      <div class="name">${esc(a.name)} ${kind}</div>
      <div class="state ${a.state}"><span class="sdot s-${a.state}"></span>${label}</div>
      <div class="last">${a.last_text ? esc(a.last_text) : `<span class="empty">${esc(a.description)}</span>`}</div>
      <div class="meta">${a.replies} replies · last active ${ago(a.last_ts)}</div></div>`;
  };
  const mgr = room.members.find(a => a.is_manager);
  $("mgrCard").innerHTML = mgr ? cardHtml(mgr) : "";
  $("mgrCard").hidden = !mgr;
  $("agents").innerHTML = room.members.filter(a => !a.is_manager).map(cardHtml).join("");

  const nameOf = id => (room.members.find(m => m.id === id) || {name: id}).name;
  const now = room.working_on || room.waiting_on;
  const steps = (now ? [`<span class="step now">${esc(now)} (now)</span>`] : [])
    .concat(room.queue.map(id => `<span class="step">${esc(nameOf(id))}</span>`));
  $("pipeline").innerHTML = `<span class="lab">Up next</span>` + (steps.length ? steps.join(`<span class="arrow">→</span>`)
    : `<span class="empty">nothing queued</span>`);

  $("feed").innerHTML = [...room.feed].reverse().map(m => `<div class="item"><div class="t">${hm(m.ts)}</div>
     <div><span class="who" style="color:${m.color || "var(--blue)"}">${esc(m.name)}</span>
     ${m.status === "thinking" ? `<span class="empty">is working…</span>` : m.status === "waiting" ? `<span style="color:var(--amber)">waiting for your relay</span>` : ""}
     <div class="txt">${esc(m.text)}</div></div></div>`).join("") || `<div class="empty">No activity yet.</div>`;

  $("files").innerHTML = D.files.map(f => `<a href="/files/${encodeURI(f.path)}" target="_blank">
     <span class="fn">${D.now - f.mtime < 3600 ? `<span class="new">NEW </span>` : ""}${esc(f.path)}</span>
     <span class="fm">${size(f.size)} · ${ago(f.mtime)}</span></a>`).join("")
     || `<div class="empty">Nothing yet. Files the Builder saves will show up here.</div>`;
}

function pin(id) { pinned = id; try { localStorage.setItem("dash-room", id); } catch {} render(); }
function fullscreen() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
function toggleSound() {
  sound = !sound; try { localStorage.setItem("dash-sound", sound ? "1" : "0"); } catch {}
  $("soundBtn").textContent = sound ? "🔔 Sound on" : "🔕 Sound off";
  if (sound) chime(true);
}
function chime(force) {
  if (!sound && !force) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    [660, 880].forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * 0.18;
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.start(t); o.stop(t + 0.4);
    });
  } catch {}
}
$("soundBtn").textContent = sound ? "🔔 Sound on" : "🔕 Sound off";
setInterval(() => $("clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}), 1000);
$("clock").textContent = new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
